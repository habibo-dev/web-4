name: Deploy to GitHub Pages

# Publishes the site to https://habibo-dev.github.io/web-4/
#
# Pages on this repo is configured for **legacy** builds from the branch root
# (the token here cannot switch it to workflow-based deployments — the API
# returns 403). Legacy mode runs Jekyll, which cannot build a Next.js app, so
# the workflow builds the static export itself and commits it to the branch
# root with a `.nojekyll` marker. Pages then republishes those files verbatim
# on the commit — no build race, no Jekyll.
#
# Loop safety: the publish commit touches only the generated paths listed in
# `paths-ignore`, so it does not start another run.

on:
  push:
    branches: [main, "arena/**"]
    paths-ignore:
      - ".nojekyll"
      - "404/**"
      - "404.html"
      - "_next/**"
      - "ar/**"
      - "fr/**"
      - "icon.svg"
      - "images/**"
      - "index.html"
      - "manifest.webmanifest"
      - "robots.txt"
      - "sitemap.xml"
  workflow_dispatch:

permissions:
  contents: write
  pages: read
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Editorial QC
        run: npm run check:data

      - name: Static build
        run: npm run build:static
        env:
          # A project page lives at https://<user>.github.io/<repo>/ — the
          # build needs the public URL (canonicals, sitemap, hreflang, OG
          # cards) and the path prefix (assets + internal links). Set the
          # SITE_URL repository variable to publish on a custom domain
          # instead; the prefix is then left empty.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_URL && '' || format('/{0}', github.event.repository.name) }}

      - name: Publish the export to the branch root
        run: node scripts/publish-to-root.mjs

      - name: Sanity-check
        run: |
          test -f .nojekyll
          test -f index.html
          test -f fr/index.html
          test -f ar/index.html
          test -f sitemap.xml
          test -f robots.txt
          echo "✓ published $(find fr ar -name '*.html' | wc -l) locale pages"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .nojekyll 404 404.html _next ar fr icon.svg images index.html manifest.webmanifest robots.txt sitemap.xml
          if git diff --cached --quiet; then
            echo "✓ no changes to publish"
            exit 0
          fi
          git commit -m "chore(pages): publish the static export"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "✓ published — Pages rebuilds from this commit"
